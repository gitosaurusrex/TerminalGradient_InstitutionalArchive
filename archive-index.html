<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive Index :: Institute for Precedent Studies Archive</title>
  <meta name="description" content="Access the complete index of the Institute for Precedent Studies Archive, including all recovered data fragments and case studies.">
  <link rel="canonical" href="https://ips-archive.org/archive-index">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ips-archive.org/archive-index">
  <meta property="og:title" content="Archive Index :: Institute for Precedent Studies Archive">
  <meta property="og:description" content="Access the complete index of the Institute for Precedent Studies Archive, including all recovered data fragments and case studies.">
  <meta property="og:image" content="https://ips-archive.org/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://ips-archive.org/archive-index">
  <meta property="twitter:title" content="Archive Index :: Institute for Precedent Studies Archive">
  <meta property="twitter:description" content="Access the complete index of the Institute for Precedent Studies Archive, including all recovered data fragments and case studies.">
  <meta property="twitter:image" content="https://ips-archive.org/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="/site.webmanifest">
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Archive Index :: Case Files",
    "description": "Access the complete index of the Institute for Precedent Studies Archive, including all recovered data fragments and case studies.",
    "url": "https://ips-archive.org/archive-index",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Institute for Precedent Studies Archive",
      "url": "https://ips-archive.org/"
    }
  }
  </script>
  <link rel="stylesheet" href="css/archive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('ips-basis') || 'auto';
      if (saved !== 'auto') {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
  <script src="/js/db-service.js" type="module"></script>
  <script src="/js/ips-components.js" type="module"></script>
  <script src="/js/ips-views.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <div class="container">

    <!-- BREADCRUMB NAVIGATION -->
    <tg-breadcrumb>
      <a href="/">Archive Access</a>
      <span>Case Files</span>
    </tg-breadcrumb>

    <!-- PAGE HEADER -->
    <header>
    <tg-box header="Archive Index :: Case Files" heading-level="1">
      <div class="metadata-grid mt-3 meta">
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Query:</div>
          <div class="metadata-grid__value">ALL FRAGMENTS</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Results:</div>
          <div class="metadata-grid__value">11 fragments</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Sort Order:</div>
          <div class="metadata-grid__value">Record ID (Ascending)</div>
        </div>
      </div>
    </tg-box>
    </header>

    <!-- TWO COLUMN LAYOUT: FILTERS + RESULTS -->
    <div class="layout-grid layout-grid--sidebar-left">

      <!-- FILTER PANEL -->
      <aside>
        <tg-filter-panel></tg-filter-panel>
      </aside>

      <!-- DOCUMENT RESULTS -->
      <main>
        <tg-archive-list></tg-archive-list>

        <!-- PAGINATION (Static for now) -->
        <tg-box compact class="action-box">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-2); width: 100%;" class="meta">
            <span>Accessing deep-time strata...</span>
            <div style="display: flex; gap: var(--space-2); flex: 1 0 auto; justify-content: flex-end;">
              <a href="#" class="btn btn--small">Previous</a>
              <a href="#" class="btn btn--small">Next</a>
            </div>
          </div>
        </tg-box>
      </main>

    </div>

    <!-- FOOTER -->
    <tg-footer mode="Catalog Index"></tg-footer>

  </div>

</body>

</html>
