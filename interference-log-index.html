<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interference Log Index :: Institute for Precedent Studies Archive</title>
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
  <link rel="stylesheet" href="css/archive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('ips-basis') || 'auto';
      if (saved !== 'auto') {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
  <script src="/js/db-service.js" type="module"></script>
  <script src="/js/ips-components.js" type="module"></script>
  <script src="/js/ips-views.js" type="module"></script>
</head>

<body>

  <div class="container">

    <!-- BREADCRUMB NAVIGATION -->
    <tg-breadcrumb>
      <a href="/">Archive Access</a>
      <span>Interference Logs</span>
    </tg-breadcrumb>

    <!-- PAGE HEADER -->
    <tg-box header="Interference Log Index :: Secondary Compilation">
      <div class="metadata-grid mt-3 meta">
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Document Class:</div>
          <div class="metadata-grid__value">SECONDARY COMPILATION</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Authority:</div>
          <div class="metadata-grid__value">NON-AUTHORITATIVE</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Epistemic Status:</div>
          <div class="metadata-grid__value">PROVISIONAL</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Scope:</div>
          <div class="metadata-grid__value">Known or suspected interference attempts against Sentinel frameworks</div>
        </div>
      </div>
    </tg-box>

    <!-- LOG LIST, GROUPED BY CATEGORY -->
    <tg-interference-log-list></tg-interference-log-list>

    <!-- ACTION BUTTONS -->
    <tg-box compact class="action-box">
      <a href="/" class="btn">Return to Archive Access</a>
    </tg-box>

    <!-- FOOTER -->
    <tg-footer mode="Secondary Archive"></tg-footer>

  </div>

</body>

</html>
