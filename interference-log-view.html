<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interference Log :: Institute for Precedent Studies Archive</title>
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
  <link rel="stylesheet" href="css/archive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('ips-basis') || 'auto';
      if (saved !== 'auto') {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
  <script src="/js/db-service.js" type="module"></script>
  <script src="/js/ips-components.js" type="module"></script>
  <script src="/js/ips-views.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <div class="container">

    <!-- BREADCRUMB NAVIGATION -->
    <tg-breadcrumb>
      <a href="/">Archive Access</a>
      <a href="/interference-log-index">Interference Logs</a>
      <span id="breadcrumb-id">Loading...</span>
    </tg-breadcrumb>

    <!-- LOG HEADER / METADATA BLOCK -->
    <tg-box id="log-header-box">
      <div
        style="border-bottom: 2px solid var(--color-border); padding-bottom: var(--space-2); margin-bottom: var(--space-3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-2);"
        class="meta">
        <div>Secondary Compilation :: Interference Log</div>
        <div>INSTITUTIONAL ARCHIVE SYSTEM</div>
      </div>

      <h1 id="log-title" style="margin-bottom: var(--space-4);">Retrieving Records...</h1>

      <div id="log-metadata" class="metadata-grid meta">
        <!-- Dynamic Metadata -->
      </div>
    </tg-box>

    <tg-box id="log-content-box" header="Log Entry (Institutional Compilation)">
      <div id="log-content" class="document-content body">
        <div class="meta">Initializing stratigraphic retrieval...</div>
      </div>
    </tg-box>

    <!-- ACTION BUTTONS -->
    <tg-box compact class="action-box">
      <a href="/interference-log-index" class="btn">Return to Interference Logs</a>
    </tg-box>

    <!-- FOOTER -->
    <tg-footer mode="Secondary Archive View"></tg-footer>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        document.getElementById('log-title').textContent = 'ERROR :: NO TARGET SPECIFIED';
        return;
      }

      const breadcrumb = document.getElementById('breadcrumb-id');
      if (breadcrumb) breadcrumb.textContent = `Record ${id}`;

      try {
        const db = await IPS_VIEW_UTILS.waitForDB();
        const logData = await db.getInterferenceLog(id);

        if (logData.length > 0) {
          renderLog(logData[0]);
        } else {
          throw new Error(`Record ${id} not located. Provide a valid Interference Log ID (e.g., IL-A01).`);
        }
      } catch (err) {
        IPS_VIEW_UTILS.handleRetrievalError(err, 'log-title', 'log-content');
      }
    });

    function renderLog(log) {
      document.getElementById('log-title').textContent = log.title;

      const breadcrumb = document.getElementById('breadcrumb-id');
      if (breadcrumb) breadcrumb.textContent = log.log_id;

      const meta = [
        { label: 'Log ID', value: log.log_id },
        { label: 'Category', value: `${log.category}: ${log.category_name || ''}` },
        { label: 'Civilization', value: log.civilization || 'UNRECORDED' },
        { label: 'Duration', value: log.duration || 'UNRECORDED' },
        { label: 'Frameworks Involved', value: log.frameworks_involved || 'None Identified' },
        { label: 'Outcome', value: log.outcome || 'UNRECORDED' },
        { label: 'Authority', value: log.authority },
        { label: 'Epistemic Status', value: log.epistemic_status }
      ];

      document.getElementById('log-metadata').innerHTML = meta.map(m => `
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">${m.label}:</div>
          <div class="metadata-grid__value">${m.value}</div>
        </div>
      `).join('');

      document.getElementById('log-content').innerHTML = `<div>${marked.parse(log.content_text)}</div>`;
    }
  </script>

</body>

</html>
