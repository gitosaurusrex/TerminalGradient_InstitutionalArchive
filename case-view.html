<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study :: Institute for Precedent Studies Archive</title>
  <meta name="description" content="View detailed case studies and civilizational analysis from the Institute for Precedent Studies Archive.">
  
  <link id="canonical-link" rel="canonical" href="https://ips-archive.org/case-view">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://ips-archive.org/case-view">
  <meta property="og:title" content="Case Study :: Institute for Precedent Studies Archive">
  <meta property="og:description" content="View detailed case studies and civilizational analysis from the Institute for Precedent Studies Archive.">
  <meta property="og:image" content="https://ips-archive.org/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://ips-archive.org/case-view">
  <meta property="twitter:title" content="Case Study :: Institute for Precedent Studies Archive">
  <meta property="twitter:description" content="View detailed case studies and civilizational analysis from the Institute for Precedent Studies Archive.">
  <meta property="twitter:image" content="https://ips-archive.org/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="/site.webmanifest">
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
  <link rel="stylesheet" href="css/archive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('ips-basis') || 'auto';
      if (saved !== 'auto') {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
  <script src="/js/db-service.js" type="module"></script>
  <script src="/js/ips-components.js" type="module"></script>
  <script src="/js/ips-views.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <div class="container">

    <!-- BREADCRUMB NAVIGATION -->
    <tg-breadcrumb>
      <a href="/">Archive Access</a>
      <a href="/case-index">CASE FILE</a>
      <span id="breadcrumb-id">Loading...</span>
    </tg-breadcrumb>

    <!-- CASE HEADER / METADATA BLOCK -->
    <header>
    <tg-box id="case-header-box">
      <div
        style="border-bottom: 2px solid var(--color-border); padding-bottom: var(--space-2); margin-bottom: var(--space-3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-2);"
        class="meta">
        <div id="collection-attribution">Analytical Window :: REMNANTS Collection</div>
        <div>INSTITUTIONAL ARCHIVE SYSTEM</div>
      </div>

      <h1 id="case-title" style="margin-bottom: var(--space-4);">Retrieving Records...</h1>

      <div id="case-metadata" class="metadata-grid meta">
        <!-- Dynamic Metadata -->
      </div>
    </tg-box>
    </header>

    <main>
    <div id="hazard-notice" hidden></div>
    <article>
    <tg-box id="case-analysis-box" header="Case Analysis (Institutional)">
      <div id="case-content" class="document-content body">
        <div class="meta">Decoding stratigraphic datagrams...</div>
      </div>
    </tg-box>
    </article>

    <!-- ACTION BUTTONS -->
    <tg-box compact class="action-box" id="case-actions" hidden>
      <a href="/case-index" class="btn">Return to Case Files</a>
      <a href="#" class="btn">Download RAW Buffer</a>
      <a href="#" class="btn">Record Verification Claim</a>
    </tg-box>
    </main>

    <!-- FOOTER -->
    <tg-footer mode="Case View Mode"></tg-footer>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        document.getElementById('case-title').textContent = 'ERROR :: NO TARGET SPECIFIED';
        return;
      }

      const breadcrumb = document.getElementById('breadcrumb-id');
      if (breadcrumb) breadcrumb.textContent = `Record ${id}`;

      try {
        const db = await IPS_VIEW_UTILS.waitForDB();

        // Attempt to fetch as a Case first
        const caseData = await db.getCase(id);

        if (caseData.length > 0) {
          const fragments = await db.getCaseFragments(id);
          const fragmentMap = new Map(fragments.map(f => [f.fragment_id, f]));
          renderCase(caseData[0], fragmentMap);
        } else {
          throw new Error(`Record ${id} is not a valid case study. Please provide a Case ID (e.g., CS-S01).`);
        }
      } catch (err) {
        IPS_VIEW_UTILS.handleRetrievalError(err, 'case-title', 'case-content');
      }
    });

    function updatePageMeta(id, title, description) {
      const fullTitle = `${title} :: Institute for Precedent Studies Archive`;
      const url = `https://ips-archive.org/case-view?id=${id}`;

      document.title = fullTitle;
      document.querySelector('meta[name="description"]').setAttribute('content', description);
      document.getElementById('canonical-link').setAttribute('href', url);
      document.querySelector('meta[property="og:url"]').setAttribute('content', url);
      document.querySelector('meta[property="og:title"]').setAttribute('content', fullTitle);
      document.querySelector('meta[property="og:description"]').setAttribute('content', description);
      document.querySelector('meta[property="twitter:url"]').setAttribute('content', url);
      document.querySelector('meta[property="twitter:title"]').setAttribute('content', fullTitle);
      document.querySelector('meta[property="twitter:description"]').setAttribute('content', description);

      // Inject JSON-LD Article schema
      const jsonLd = document.createElement('script');
      jsonLd.type = 'application/ld+json';
      jsonLd.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": title,
        "description": description,
        "url": url,
        "image": "https://ips-archive.org/og-image.png",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Institute for Precedent Studies Archive",
          "url": "https://ips-archive.org/"
        }
      });
      document.head.appendChild(jsonLd);
    }

    function renderCase(c, fragmentMap) {
      const desc = `Institutional case study ${c.case_id}: ${c.title}. Phenomenological pattern: ${c.pattern_name}. Epoch: ${c.epoch_estimate}.`;
      updatePageMeta(c.case_id, c.title, desc);

      const hazardEl = document.getElementById('hazard-notice');
      if (c.hazard_level && c.hazard_level !== 'none') {
        hazardEl.innerHTML =
          `<span>[EPISTEMIC HAZARD :: ${c.hazard_level.toUpperCase()}]</span>` +
          `<span>[${c.epistemic_status.toUpperCase()}]</span>`;
        hazardEl.className = 'hazard-notice';
        hazardEl.hidden = false;
      }

      document.getElementById('case-title').textContent = c.title;
      document.getElementById('collection-attribution').textContent = `Analytical Window :: INSTITUTIONAL ANALYTICS`;

      const meta = [
        { label: 'Access Level', value: c.access_level },
        { label: 'Case ID', value: c.case_id },
        { label: 'Epoch Estimate', value: c.epoch_estimate },
        { label: 'Observed Pattern', value: c.pattern_name },
        { label: 'Last Verification', value: c.last_verification_date || 'N/A' },
        { label: 'Validation Hash', value: c.validation_hash || 'N/A' }
      ];

      document.getElementById('case-metadata').innerHTML = meta.map(m => `
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">${m.label}:</div>
          <div class="metadata-grid__value">${m.value}</div>
        </div>
      `).join('');

      window._fragmentData = window._fragmentData || {};

      let analysisHtml = marked.parse(c.analysis_text);
      analysisHtml = analysisHtml.replace(/<p>\[\[SURFACE_FRAGMENT:(RF-\d+)\]\]<\/p>/g, (match, fragmentId) => {
        const f = fragmentMap.get(fragmentId);
        if (!f) return match;
        window._fragmentData[f.fragment_id] = f;
        return `
          <div class="fragment-frame">
            <div class="fragment-frame__header meta">
              <div class="fragment-frame__metrics">
                <span>REF: ${f.fragment_id}</span>
                <span>STRATA: ${formatStrata(f.strata_depth)}m</span>
                <span>ISO-VAR: ${f.isotope_variance || 'NULL'}</span>
                <span>EPI-CONF: ${f.epistemic_confidence}</span>
                ${window.generateFlavorMetrics ? window.generateFlavorMetrics() : ''}
              </div>
              <button class="info-icon" onclick='window.showMetadataModal(window._fragmentData["${f.fragment_id}"])'>i</button>
            </div>
            <div class="fragment-frame__content document-content">
              <div>${marked.parse(f.content_text)}</div>
            </div>
          </div>
        `;
      });

      document.getElementById('case-content').innerHTML = `<div>${analysisHtml}</div>`;
      document.getElementById('case-actions').hidden = false;
    }

    function renderStandaloneFragment(f) {
      document.getElementById('case-title').textContent = f.title;
      document.getElementById('collection-attribution').textContent = `Analytical Window :: ${f.collection_attribution} Collection`;

      window._fragmentData = window._fragmentData || {};
      window._fragmentData[f.fragment_id] = f;

      const meta = [
        { label: 'Fragment ID', value: f.fragment_id },
        { label: 'Strata Depth', value: `${formatStrata(f.strata_depth)}m` },
        { label: 'Time Reference', value: f.time_reference_basis },
        { label: 'Epistemic Confidence', value: `${f.epistemic_confidence}%` }
      ];

      document.getElementById('case-metadata').innerHTML = meta.map(m => `
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">${m.label}:</div>
          <div class="metadata-grid__value">${m.value}</div>
        </div>
      `).join('');

      document.getElementById('case-content').innerHTML = `
        <div class="fragment-frame">
            <div class="fragment-frame__header meta">
                <span>VERBATIM ENCODING</span>
                <button class="info-icon" onclick='window.showMetadataModal(window._fragmentData["${f.fragment_id}"])'>
                    i
                </button>
            </div>
            <div class="fragment-frame__content document-content">
                <div>${marked.parse(f.content_text)}</div>
            </div>
        </div>
      `;
    }
  </script>
</body>

</html>
