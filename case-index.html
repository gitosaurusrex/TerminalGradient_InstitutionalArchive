<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case File Index :: Institute for Precedent Studies Archive</title>
  <meta name="description" content="Browse the index of verified civilizational anomalies and phenomenological patterns in the Institute for Precedent Studies Archive.">
  <link rel="canonical" href="https://ips-archive.org/case-index">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ips-archive.org/case-index">
  <meta property="og:title" content="Case File Index :: Institute for Precedent Studies Archive">
  <meta property="og:description" content="Browse the index of verified civilizational anomalies and phenomenological patterns in the Institute for Precedent Studies Archive.">
  <meta property="og:image" content="https://ips-archive.org/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://ips-archive.org/case-index">
  <meta property="twitter:title" content="Case File Index :: Institute for Precedent Studies Archive">
  <meta property="twitter:description" content="Browse the index of verified civilizational anomalies and phenomenological patterns in the Institute for Precedent Studies Archive.">
  <meta property="twitter:image" content="https://ips-archive.org/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="/site.webmanifest">
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Case File Index",
    "description": "Browse the index of verified civilizational anomalies and phenomenological patterns in the Institute for Precedent Studies Archive.",
    "url": "https://ips-archive.org/case-index",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Institute for Precedent Studies Archive",
      "url": "https://ips-archive.org/"
    }
  }
  </script>
  <link rel="stylesheet" href="css/archive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('ips-basis') || 'auto';
      if (saved !== 'auto') {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
  <script src="/js/db-service.js" type="module"></script>
  <script src="/js/ips-components.js" type="module"></script>
  <script src="/js/ips-views.js" type="module"></script>
</head>

<body>

  <div class="container">

    <!-- BREADCRUMB NAVIGATION -->
    <tg-breadcrumb>
      <a href="/">Archive Access</a>
      <span>Case Files</span>
    </tg-breadcrumb>

    <!-- PAGE HEADER -->
    <header>
    <tg-box header="Case File Index" heading-level="1">
      <div class="metadata-grid mt-3 meta">
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Collection:</div>
          <div class="metadata-grid__value">INSTITUTIONAL ANALYTICS</div>
        </div>
        <div class="metadata-grid__row">
          <div class="metadata-grid__label">Access Level:</div>
          <div class="metadata-grid__value">PUBLIC / VERIFIED</div>
        </div>
      </div>
    </tg-box>
    </header>

    <!-- TWO COLUMN LAYOUT -->
    <div class="layout-grid layout-grid--sidebar-left">

      <!-- FILTER PANEL -->
      <aside>
        <tg-filter-panel></tg-filter-panel>
      </aside>

      <!-- DOCUMENT RESULTS -->
      <main>
        <tg-case-list></tg-case-list>
      </main>

    </div>

    <!-- FOOTER -->
    <tg-footer mode="Case File Index"></tg-footer>

  </div>

</body>

</html>
